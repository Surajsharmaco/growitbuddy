    <!-- Preconnect to reduce font DNS + TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Non-blocking font load:
      rel="preload" as="style" fetches the CSS in the background without blocking render.
      onload switches it to a real stylesheet once fetched.
      The <noscript> fallback covers JS-disabled browsers.
    -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <link rel="preconnect"   href="https://app.cal.com" />
    <link rel="dns-prefetch" href="https://app.cal.com" />

    <!-- WordPress headless API — preconnect reduces blog post load latency -->
    <link rel="preconnect"   href="https://blog.growitbuddy.com" crossorigin />
    <link rel="dns-prefetch" href="https://blog.growitbuddy.com" />
